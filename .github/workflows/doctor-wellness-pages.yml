name: Doctor Wellness Pages

on:
  push:
    branches: [main]
    paths:
      - doctor-wellness-premium.html
      - .github/workflows/doctor-wellness-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: doctor-wellness-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p public/doctor-wellness-premium
          cp doctor-wellness-premium.html public/doctor-wellness-premium/index.html
          cat > public/index.html <<'EOF'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./doctor-wellness-premium/"><title>Doctor Wellness Premium</title></head><body><a href="./doctor-wellness-premium/">Abrir Doctor Wellness Premium</a></body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
